<!-- Bulletproof button: expects url, label; optional align ("center"|"left", default center) -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="{{ align|default:"center" }}" style="padding:8px 0 4px 0;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ url|default:"#" }}" style="height:44px;v-text-anchor:middle;width:240px;" arcsize="14%" stroke="f" fillcolor="{{ color|default:"#2563eb" }}">
        <w:anchorlock/>
        <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:600;">{{ label }}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-- -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" class="btn-td">
        <tr>
          <td align="center" bgcolor="{{ color|default:"#2563eb" }}" style="border-radius:6px;">
            <a href="{{ url|default:"#" }}" class="btn-a" style="display:inline-block; padding:13px 34px; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:6px;">{{ label }}</a>
          </td>
        </tr>
      </table>
      <!--<![endif]-->
    </td>
  </tr>
</table>
